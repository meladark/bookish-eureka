version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: calendar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #ports:
    #  - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - calendar_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../
      dockerfile: build/Dockerfile
    container_name: calendar_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
    environment:
      CALENDAR_STORAGE_TYPE: "sql"
      CALENDAR_STORAGE_SQL_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
      CALENDAR_HTTP_SERVER_HOST: "0.0.0.0"
      CALENDAR_HTTP_SERVER_PORT: "8080"
      CALENDAR_LOGGER_LEVEL: ${APP_LOG_LEVEL}
      CALENDAR_LOGGER_LOGFILE: "./calendar.log"
    volumes:
      - .:/app
    networks:
      - calendar_network

volumes:
  pgdata:

networks:
  calendar_network:
    driver: bridge
