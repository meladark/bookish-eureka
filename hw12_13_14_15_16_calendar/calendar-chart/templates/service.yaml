---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: api
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
spec:
  type: ClusterIP
  selector:
    app: scheduler
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: sender
spec:
  type: ClusterIP
  selector:
    app: sender
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
